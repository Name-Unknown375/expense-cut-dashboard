name: copy-page-to-feature
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copy-page-to-feature.yml"
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/auto-categorize-spend-3c2c
          fetch-depth: 0
      - name: Copy page.tsx from main
        run: |
          git fetch origin main
          git checkout origin/main -- src/app/import/page.tsx
          test -s src/app/import/page.tsx
          grep -q suggest-mapping src/app/import/page.tsx
          wc -c src/app/import/page.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/import/page.tsx
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Use Gemini to auto-map bank CSV columns on import"
          git push origin HEAD:cursor/auto-categorize-spend-3c2c
